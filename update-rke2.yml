---
- hosts: control_plane_nodes:worker_nodes
  become: true
  serial: 1
  vars_files:
    - roles/rke2_cluster/vars/main.yml
    - roles/rke2_cluster/vars/kubectl.yml
  vars:
    delegation_target: "{{ groups['control_plane_nodes'][0] }}"
    rebuilding_first_node: "{{ inventory_hostname == groups['control_plane_nodes'][0] }}"
  roles:
    - rke2-update
  tasks:
    - name: Drain node before restarting services
      ansible.builtin.include_role:
        name: rke2_cluster
        tasks_from: drain_node
      when: inventory_hostname in groups['control_plane_nodes'] or inventory_hostname in groups['worker_nodes']

    - name: Restart RKE2 service
      ansible.builtin.systemd:
        name: "rke2-{{ 'server' if inventory_hostname in groups['control_plane_nodes'] else 'agent' }}"
        state: restarted
        enabled: true
      become: true
      when: inventory_hostname in groups['control_plane_nodes'] or inventory_hostname in groups['worker_nodes']

    - name: Wait for node Ready after restart
      ansible.builtin.shell: |
        set -o pipefail
        {{ kubectl.command }} get nodes {{ inventory_hostname | lower }} \
          -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
      args:
        executable: /bin/bash
      register: node_ready
      until: node_ready.rc == 0 and node_ready.stdout == "True"
      retries: "{{ 60 if rebuilding_first_node else 30 }}"
      delay: "{{ 20 if rebuilding_first_node else 10 }}"
      delegate_to: "{{ delegation_target }}"
      become: true
      changed_when: false
      environment:
        KUBECONFIG: "{{ paths.rke2.kubeconfig }}"
      when: inventory_hostname in groups['control_plane_nodes'] or inventory_hostname in groups['worker_nodes']

    - name: Wait for kube-system pods on node
      ansible.builtin.shell: |
        set -euo pipefail
        non_running=$({{ kubectl.command }} get pods -n kube-system \
          --field-selector "spec.nodeName={{ inventory_hostname | lower }},status.phase!=Running" \
          --no-headers -o custom-columns=NAME:.metadata.name,STATUS:.status.phase)
        if [ -n "$non_running" ]; then
          echo "$non_running"
          exit 1
        fi
        exit 0
      args:
        executable: /bin/bash
      register: pod_status
      until: pod_status.rc == 0
      retries: "{{ 60 if rebuilding_first_node else 30 }}"
      delay: "{{ 20 if rebuilding_first_node else 10 }}"
      delegate_to: "{{ delegation_target }}"
      become: true
      changed_when: false
      environment:
        KUBECONFIG: "{{ paths.rke2.kubeconfig }}"
      when: inventory_hostname in groups['control_plane_nodes'] or inventory_hostname in groups['worker_nodes']

    - name: Wait additional time for first control plane stabilization
      when: rebuilding_first_node
      ansible.builtin.pause:
        seconds: 120

    - name: Uncordon node after update
      ansible.builtin.include_role:
        name: rke2_cluster
        tasks_from: uncordon_node
      vars:
        kubectl:
          command: "{{ kubectl.command }}"
          config: "{{ paths.rke2.kubeconfig }}"
      when: inventory_hostname in groups['control_plane_nodes'] or inventory_hostname in groups['worker_nodes']
