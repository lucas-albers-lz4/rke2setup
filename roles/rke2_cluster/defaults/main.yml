---
# RKE2 Cluster Default Variables
#rke2_version: "v1.31.4+rke2r1"  # Update this to match your desired version

# Wait Configuration
wait_config:
  retries: 30
  delay: 10

# Installation Types
install_types:
  server: server
  agent: agent

# Services
services:
  server: rke2-server
  agent: rke2-agent

# Commands
commands:
  rke2: /usr/local/bin/rke2
  kubectl: /usr/local/bin/kubectl

# Network Configuration — single source of truth for CNI
rke2_cni: cilium
network:
  plugin: "{{ rke2_cni }}"
  cni_version: v1.14.0

# Additional Add-ons
install_cilium: true
install_metrics_server: true
install_dashboard: false

# Security Configuration
pod_security_admission:
  enabled: true
  default_profile: baseline

# Resource Constraints
system_requirements:
  min_cpu_cores: 2
  min_memory_mb: 4096
  max_memory_mb: 16384

# Logging Configuration
logging:
  level: info
  output_file: /var/log/rke2/rke2.log

# Experimental Features
experimental:
  enable_custom_registries: false
  custom_registries_path: /etc/rancher/rke2/registries.yaml

# Default configurations
default_config:
  token: rke2-cluster-token
  cni: "{{ rke2_cni }}"
  disable:
    - rke2-ingress-nginx
  node-taint: []

# Feature flags
enable_monitoring: true
enable_ingress: true

# Timeout and retry settings
rke2_wait_settings:
  timeout: 300
  retries: 30
  delay: 10
  connect_timeout: 5

# Port definitions
rke2_ports:
  supervisor: 9345
  api: 6443
  etcd_client: 2379
  etcd_peer: 2380

# State definitions
rke2_states:
  STARTING:
    pattern: "Starting rke2-server"
    completed: false
  INIT:
    pattern: "Cluster-init mode enabled"
    completed: false
  RUNNING:
    pattern: "Running kube-apiserver"
    completed: false

# Default file permissions
file_modes:
  directory:
    default: "0755"
    secure: "0700"
  file:
    default: "0644"
    secure: "0600"

# Default RKE2 configuration if not specified in group_vars
# Use tls_san (underscore) in Ansible vars; template renders as tls-san:
rke2_config:
  write_kubeconfig_mode: "0644"
  token: "" # Will be generated if not provided
  tls_san:
    - "127.0.0.1"
    - "localhost"
    - "kubernetes"
    - "kubernetes.default"
    - "kubernetes.default.svc"
    - "kubernetes.default.svc.cluster.local"

kubeconfig_dest: "{{ lookup('env', 'HOME') }}/.kube/config-rke2"

# Timeout configurations
retry_delay: 10
retry_quick: 3
retry_standard: 6
retry_extended: 30

timeout_short: 30
timeout_standard: 60
timeout_service: 180
timeout_startup: 300
timeout_reboot: 600
timeout_connection: 30
timeout_api_check: 180

# Airgap installation — opt-in; online installs are the default
airgap_install: false
