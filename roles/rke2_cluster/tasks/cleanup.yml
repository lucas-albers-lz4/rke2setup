---
- name: Stop RKE2 services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - rke2-server
    - rke2-agent
  ignore_errors: true

- name: Run RKE2 killall script if exists
  ansible.builtin.command:
    cmd: /usr/local/bin/rke2-killall.sh
  failed_when: false
  ignore_errors: true

- name: Pause to allow processes to terminate
  ansible.builtin.wait_for:
    timeout: "{{ timeout_short }}"

- name: Get mount information
  ansible.builtin.shell: mount | grep "{{ paths.rke2.agent }}"
  register: mount_check
  failed_when: false
  changed_when: false

- name: Unmount agent directory if mounted
  ansible.builtin.mount:
    path: "{{ paths.rke2.agent }}"
    state: unmounted
  when: mount_check.rc == 0
  ignore_errors: true

- name: Remove mount from fstab
  ansible.builtin.mount:
    path: "{{ paths.rke2.agent }}"
    state: absent
  when:
    - mounts.agent.enabled | bool
    - mounts.agent.device is defined

- name: Pause after unmounting
  ansible.builtin.wait_for:
    timeout: 5
  when: mount_check.rc == 0

- name: Run RKE2 uninstall script
  ansible.builtin.command:
    cmd: /usr/local/bin/rke2-uninstall.sh
  failed_when: false
  ignore_errors: true

- name: Remove systemd service files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/lib/systemd/system/rke2-server.service
    - /usr/local/lib/systemd/system/rke2-agent.service
    - /etc/systemd/system/rke2-server.service
    - /etc/systemd/system/rke2-agent.service
    - /etc/systemd/system/rke2-server.service.env
    - /etc/systemd/system/rke2-agent.service.env

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Remove remaining RKE2 paths
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ paths.rke2.data }}"
    - "{{ paths.rke2.config }}"
    - "{{ paths.system.bin }}/rke2"
    - "{{ paths.system.bin }}/kubectl"
    - "{{ paths.system.bin }}/ctr"
    - "{{ paths.system.bin }}/crictl"
    - "{{ paths.user.kube }}"
    - /var/lib/kubelet
    - /etc/kubernetes
    - /run/k3s
    - /run/k3s/containerd
    - /run/containerd
    - /run/flannel
    - /etc/cni
    - /var/lib/cni
    - /var/log/pods
    - /var/log/containers
    - /opt/rke2
    - /opt/cni
    - /home/ubuntu/.kube

- name: Extra-destructive leftover cleanup
  when: rke2_cleanup_confirmed | default(false) | bool
  block:
    - name: Require playbook confirmation for extra-destructive cleanup
      ansible.builtin.assert:
        that:
          - rke2_cleanup_confirmed | bool
        fail_msg: >-
          Extra-destructive leftover cleanup (containerd kill/umount, remaining
          process kill, network iface delete, iptables flush, journal vacuum)
          requires confirmation from cleanup.yml. Complete the playbook pause
          so rke2_cleanup_confirmed is set; the role will not run these steps
          without that confirmation.

    - name: Kill any remaining containerd processes
      ansible.builtin.shell: |
        pkill -9 containerd || true
        pkill -9 -f "k3s" || true
        for mp in $(mount | grep containerd | awk '{print $3}'); do
          umount -f $mp || true
        done
        for mp in $(mount | grep "shm" | grep "k3s\|rke2" | awk '{print $3}'); do
          umount -f $mp || true
        done
      changed_when: false
      failed_when: false

    - name: Wait for processes to terminate
      ansible.builtin.wait_for:
        timeout: 5

    - name: Clean containerd directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ paths.rke2.agent }}/containerd/"
        - /run/containerd
        - /run/k3s/containerd
      failed_when: false

    - name: Kill remaining RKE2-related processes
      ansible.builtin.shell: |
        for pid in $(ps -ef | grep -E "rke2|containerd" | grep -v grep | awk '{print $2}'); do
          kill -9 $pid || true
        done
        pkill -9 -f "rke2" || true
        pkill -9 -f "containerd" || true
        pkill -9 -f "kubelet" || true
        pkill -f "journalctl.*rke2" || true
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false

    - name: Clean up network interfaces
      ansible.builtin.shell: |
        ip link delete cni0 || true
        ip link delete flannel.1 || true
        ip link delete flannel-v6.1 || true
        rm -rf /var/lib/cni/
        rm -rf /etc/cni/
      changed_when: false
      failed_when: false

    - name: Flush iptables
      ansible.builtin.shell: |
        iptables -F
        iptables -X
        iptables -t nat -F
        iptables -t nat -X
        iptables -t mangle -F
        iptables -t mangle -X
        iptables -P INPUT ACCEPT
        iptables -P FORWARD ACCEPT
        iptables -P OUTPUT ACCEPT
      changed_when: false
      failed_when: false

    - name: Clean up RKE2 journal logs
      ansible.builtin.shell: |
        systemctl kill --kill-who=main --signal=SIGUSR2 systemd-journald
        journalctl --rotate --vacuum-time=1s --unit=rke2-server
        rm -f /var/log/journal/*/*.journal
        systemctl restart systemd-journald
      args:
        executable: /bin/bash
      register: journal_cleanup
      failed_when: false
      changed_when: journal_cleanup.rc == 0
