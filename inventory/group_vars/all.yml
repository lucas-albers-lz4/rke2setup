---
# Cluster-wide variables (loaded via inventory/ path from ansible.cfg)

# Standardized kubectl command with proper paths
kube_cmd: "{{ kubectl.command }}"

# ETCD command configuration
etcdctl_params: >-
  --endpoints=https://127.0.0.1:2379
  --cacert=/var/lib/rancher/rke2/server/tls/etcd/server-ca.crt
  --cert=/var/lib/rancher/rke2/server/tls/etcd/server-client.crt
  --key=/var/lib/rancher/rke2/server/tls/etcd/server-client.key

# Default RKE2 data paths
rke2_data_dir: /var/lib/rancher/rke2
rke2_agent_dir: "{{ rke2_data_dir }}/agent"

# Mount configuration (optional per node)
rke2_agent_mount:
  enabled: false
  device: ""
  fstype: xfs
  opts: defaults

ansible_python_interpreter: /usr/bin/python3
ansible_user: ubuntu

commands:
  rke2: /usr/local/bin/rke2

paths:
  rke2:
    bin: /var/lib/rancher/rke2/bin
    config: /etc/rancher/rke2
    data: /var/lib/rancher/rke2
  system:
    bin: /usr/local/bin

rke2_config:
  write_kubeconfig_mode: "0644"
  token: ""
  tls_san:
    - 127.0.0.1
    - localhost

rke2_token: ""
tls_san:
  - 127.0.0.1
  - localhost
